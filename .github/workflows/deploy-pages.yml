name: Quality and Pages

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      revision:
        description: Exact current main SHA to publish; must match this workflow revision
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: plega-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Node24 and browser
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Match explicitly requested revision
        env:
          REQUESTED_REVISION: ${{ inputs.revision }}
        run: |
          if [[ -n "$REQUESTED_REVISION" && "$REQUESTED_REVISION" != "$GITHUB_SHA" ]]; then
            echo 'Requested SHA differs from the selected workflow revision.' >&2
            exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Isolated locked dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements-dev.txt
          npm --prefix frontend ci
      - name: Source, data and independent numeric checks
        run: |
          .venv/bin/python scripts/project.py test
          npm --prefix frontend run format:check
      - name: Build exact Pages artifact
        run: |
          .venv/bin/python scripts/project.py build --require-clean --revision "$GITHUB_SHA"
          git diff --exit-code
      - name: Install the locked browser
        working-directory: frontend
        run: npm exec --no -- playwright install --with-deps chromium
      - name: Exercise the exact staged application
        env:
          PLEGA_QA_OUTPUT: ${{ runner.temp }}/plega-browser
        run: .venv/bin/python scripts/project.py verify-ui
      - name: Verify artifact remains unchanged after browser tests
        run: .venv/bin/python scripts/release.py verify
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plega-browser-${{ github.sha }}
          path: ${{ runner.temp }}/plega-browser
          if-no-files-found: ignore
          retention-days: 14
      - name: Read configured custom-domain Pages binding
        if: github.ref == 'refs/heads/main'
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - name: Require the documented custom domain
        if: github.ref == 'refs/heads/main'
        env:
          PAGES_HOST: ${{ steps.pages.outputs.host }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          test "$PAGES_HOST" = plega.fasl-work.com
          test -z "$PAGES_BASE_PATH"
      - name: Upload the tested Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/pages
          retention-days: 7
      - name: Preserve exact release identity
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plega-pages-identity-${{ github.sha }}
          path: |
            build/pages/release.json
            build/pages-build-receipt.json
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Publish verified Pages artifact
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish without rebuilding
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
